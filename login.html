<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Sistema47</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css"/>
  <style>

    body {
      font-family: 'DM Sans', Arial, sans-serif;
      background-color: #1a2b5e;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -140px; right: -140px;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: rgba(37,99,235,0.18);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -80px;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(34,197,94,0.09);
      pointer-events: none;
    }

    /* Logo canto superior esquerdo */
    .logo-icon {
      position: absolute;
      top: 28px; left: 32px;
      display: flex; align-items: center; gap: 10px;
      z-index: 10;
    }
    .logo-icon img { width: 32px !important; height: 32px !important; border-radius: 8px; }
    .logo-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); }
    .logo-sub  { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.6px; text-transform: uppercase; }

    /* Badge online */
    .status-bar {
      position: absolute;
      top: 28px; right: 32px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 20px; padding: 5px 12px;
      font-size: 11px; color: #86efac; font-weight: 500;
      z-index: 10;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    /* Container (card branco) */
    .container {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #dde3f0;
      max-width: 400px;
      width: 90%;
      padding: 40px 40px 36px;
      margin: 20px auto;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    }

    /* Ícone de usuário */
    .avatar-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(37,99,235,0.08);
      border: 2px solid rgba(37,99,235,0.18);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .avatar-ring svg { width: 24px; height: 24px; stroke: #2563eb; }

    h1 {
      font-size: 23px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-weight: 600;
      color: #0f172a;
      text-align: left;
      margin-bottom: 4px;
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin-bottom: 28px;
      text-align: left;
    }

    /* Labels */
    .loginesenha {
      font: 600 11px 'DM Sans', Arial, sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #64748b;
      padding-bottom: 6px;
    }

    .senha-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .senha-row .loginesenha { padding-bottom: 0; }

    a#link-esqueceu {
      display: inline;
      font-size: 12px;
      color: #2563eb;
      font-weight: 500;
      margin: 0; padding: 0;
      text-decoration: none;
    }
    a#link-esqueceu:hover { text-decoration: underline; }

    /* Inputs com ícone */
    .input-wrap { position: relative; margin-top: 6px; margin-bottom: 16px; }

    .input-wrap svg.prefix {
      position: absolute;
      left: 13px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px;
      stroke: #94a3b8; pointer-events: none;
    }

    input[type="email"],
    input[type="password"] {
      color: #0f172a;
      background: #f8fafd;
      width: 100%;
      height: 44px;
      padding: 0 44px 0 40px;
      margin: 0;
      border: 1.5px solid #dde3f0;
      border-radius: 10px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      box-sizing: border-box;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder { color: #94a3b8; }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: #fff;
    }

    /* Botão olho */
    button.toggle-pw {
      position: absolute;
      right: 13px; top: 50%; transform: translateY(-50%);
      background: none !important; border: none !important;
      width: auto !important; padding: 0 !important; margin: 0 !important;
      cursor: pointer; color: #94a3b8;
      display: flex; align-items: center;
      border-radius: 0 !important;
    }
    button.toggle-pw:hover { background: none !important; color: #64748b; transform: translateY(-50%) !important; }
    button.toggle-pw svg { width: 16px; height: 16px; }

    /* Checkbox manter conectado */
    .remember {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 22px; cursor: pointer;
    }
    .remember input[type="checkbox"] {
      width: 15px !important; height: 15px !important;
      accent-color: #2563eb;
      padding: 0 !important; margin: 0 !important;
      background: none !important; border: none !important;
      border-radius: 4px;
    }
    .remember span { font-size: 13px; color: #64748b; }

    /* Botão principal (Entrar) */
    button[type="button"]:not(.toggle-pw):not(#butaocadastro) {
      width: 100%;
      height: 46px;
      padding: 0;
      background: #1a2b5e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 0; margin-bottom: 10px;
      transition: background 0.15s, transform 0.1s;
    }
    button[type="button"]:not(.toggle-pw):not(#butaocadastro):hover {
      background: #121e45;
      transform: translateY(-1px);
    }
    button[type="button"] svg { width: 16px; height: 16px; }

    /* Divisor */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 6px 0 14px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #dde3f0; }
    .divider span { font-size: 12px; color: #94a3b8; font-weight: 500; }

    /* Botão cadastro */
    #butaocadastro {
      width: 100%;
      max-width: 100%;
      height: 44px;
      padding: 0;
      background: transparent;
      color: #0f172a;
      border: 1.5px solid #dde3f0;
      border-radius: 10px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    #butaocadastro:hover {
      background: rgba(26,43,94,0.04);
      border-color: #1a2b5e;
      transform: translateY(-1px);
    }
    #butaocadastro svg { stroke: #64748b; width: 16px; height: 16px; }

    a:has(#butaocadastro) { display: block; margin: 0; padding: 0; }

    /* Erro */
    .erro {
      color: red;
      font-size: 13px;
      text-align: left;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    p { display: none; }

    @media (max-width: 600px) {
      .container { width: 95%; padding: 28px 24px; }
      h1 { font-size: 20px; }
      .logo-icon, .status-bar { display: none; }
    }
  </style>
</head>
<body>

  <div class="logo-icon">
    <img src="logo/logo (2).png" alt="Logo">
    <div>
      <div class="logo-name">SISTEMA47</div>
      <div class="logo-sub">Controle de Materiais</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-dot"></span>
    Sistema online
  </div>

  <div class="container" aria-label="Área de login">

    <div class="avatar-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>

    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Acesse sua conta para continuar.</p>

    <div class="loginesenha">EMAIL *</div>
    <div class="input-wrap">
      <svg class="prefix" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m2 7 10 7 10-7"/>
      </svg>
      <input type="email" id="email" placeholder="Digite seu email" aria-label="Email" />
    </div>
    <div id="erro-email" class="erro" style="display:none">E-mail inválido.</div>

    <div class="senha-row">
      <div class="loginesenha">SENHA *</div>
      <a id="link-esqueceu" href="esqueceu-a-senha.html">Esqueceu a senha?</a>
    </div>
    <div class="input-wrap">
      <svg class="prefix" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="senha" placeholder="Digite sua senha" aria-label="Senha" />
      <button class="toggle-pw" type="button" aria-label="Mostrar senha" onclick="toggleSenha(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div id="erro-senha" class="erro" style="display:none">Senha obrigatória.</div>

    <label class="remember">
      <input type="checkbox" name="lembrar" />
      <span>Manter conectado</span>
    </label>

    <button type="button" onclick="validarLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Entrar
    </button>

    <div class="divider"><span>ou</span></div>

    <p>Não tem conta?</p>
    <a href="criarconta.html">
      <button id="butaocadastro" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Cadastre-se
      </button>
    </a>

  </div>

  <script>
    function toggleSenha(btn) {
      const input = document.getElementById('senha');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('svg').innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
