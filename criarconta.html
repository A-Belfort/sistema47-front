</body>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar Conta — Sistema47</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2b5e;
      --navy-dark: #121e45;
      --blue-accent: #2563eb;
      --green: #22c55e;
      --surface: #eef1f8;
      --white: #ffffff;
      --border: #dde3f0;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --input-bg: #f8fafd;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* background decoration */
    body::before {
      content: '';
      position: absolute;
      top: -120px; right: -120px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: rgba(37,99,235,0.18);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -80px;
      width: 380px; height: 380px;
      border-radius: 50%;
      background: rgba(34,197,94,0.1);
      pointer-events: none;
    }

    /* logo top-left */
    .logo-corner {
      position: absolute;
      top: 28px; left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .logo-box {
      width: 34px; height: 34px;
      background: var(--blue-accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 13px;
      color: #fff;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.3px;
    }

    .logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* card */
    .card {
      background: var(--white);
      border-radius: 20px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
      padding: 40px 40px 36px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      margin: 20px;
    }

    .card-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37,99,235,0.07);
      border: 1px solid rgba(37,99,235,0.15);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--blue-accent);
      margin-bottom: 12px;
    }

    .card-eyebrow span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--blue-accent);
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* stepper */
    .stepper {
      display: flex;
      align-items: center;
      margin-bottom: 26px;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      position: relative;
    }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 12px; left: 50%;
      width: 100%; height: 1.5px;
      background: var(--border);
    }

    .step.done:not(:last-child)::after { background: var(--blue-accent); }

    .step-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    .step.active .step-dot { border-color: var(--blue-accent); background: var(--blue-accent); color: #fff; }
    .step.done .step-dot   { border-color: var(--green); background: var(--green); color: #fff; }

    .step-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .step.active .step-label { color: var(--blue-accent); font-weight: 600; }

    /* form */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field { margin-bottom: 0; }
    .field.full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    label .req { color: var(--blue-accent); margin-left: 2px; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 42px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input::placeholder { color: var(--text-muted); font-size: 13.5px; }

    input:focus {
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: var(--white);
    }

    .btn-primary {
      width: 100%;
      height: 44px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      margin-bottom: 10px;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--navy-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary svg { width: 16px; height: 16px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
    }

    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    .divider span { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .btn-secondary {
      width: 100%;
      height: 44px;
      background: transparent;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn-secondary:hover { border-color: var(--navy); background: rgba(26,43,94,0.04); }
    .btn-secondary svg { width: 16px; height: 16px; }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 18px;
    }

    .footer-text a { color: var(--blue-accent); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <div class="logo-corner">
    <div class="logo-box">47</div>
    <div>
      <div class="logo-text">SISTEMA47</div>
      <div class="logo-sub">Controle de Materiais</div>
    </div>
  </div>

  <div class="card">
    <div class="card-eyebrow"><span></span>Novo acesso</div>
    <h1 class="card-title">Criar sua conta</h1>
    <p class="card-desc">Preencha os dados abaixo para acessar o Sistema47.</p>

    <div class="stepper" aria-label="Etapas do cadastro">
      <div class="step done">
        <div class="step-dot">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="step-label">Dados</span>
      </div>
      <div class="step active">
        <div class="step-dot">2</div>
        <span class="step-label">Acesso</span>
      </div>
      <div class="step">
        <div class="step-dot">3</div>
        <span class="step-label">Confirmar</span>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="nome">Nome <span class="req">*</span></label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" autocomplete="family-name" />
      </div>
      <div class="field full">
        <label for="email">E-mail corporativo <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="usuario@empresa.com.br" autocomplete="email" />
      </div>
      <div class="field">
        <label for="senha">Senha <span class="req">*</span></label>
        <input type="password" id="senha" name="senha" placeholder="Mín. 8 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmar">Confirmar <span class="req">*</span></label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" autocomplete="new-password" />
      </div>
    </div>

    <a onclick="validarCadastro()" class="btn-primary" id="btncadastro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Criar conta
    </a>

    <div class="divider"><span>ou</span></div>

    <a href="login.html" class="btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Já tenho conta — Fazer login
    </a>

    <p class="footer-text">
      Ao criar sua conta você concorda com os
      <a href="#">termos de uso</a> do Sistema47.
    </p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
